<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: #ffffff;
        }
        /* Estilo base compartido para los recuadros con efecto vidrio */
        .glass-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }
        /* Recuadro específico para el título superior */
        .title-box {
            margin-bottom: 15px; /* Separación con el cuadro de abajo */
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Recuadro del Título Superior -->
                <div class="glass-box title-box shadow-lg">
                    <h2 class="fw-bold m-0 text-uppercase tracking-wide">Portafolio</h2>
                    <br>
                    <h5 class="fw-bold m-0 text-uppercase tracking-wide">Amil Federico</h5>
                </div>
                <br>
                <!-- Recuadro de los Proyectos -->
                <div class="glass-box p-5 shadow-lg">
                    <h1 class="fw-bold m-0 text-uppercase tracking-wide">Mis Proyectos</h1>
                    <br>
                    <a href="https://github.com/Amil-Federico/Gestion-de-proyectos-y-tareas" 
                       class="btn btn-primary btn-lg w-100 mb-3 py-3 fw-semibold shadow" 
                       target="_blank">
                        Gestión de proyectos y tareas 
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
